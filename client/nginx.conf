# WebSocket: switch the connection to "upgrade" only when the client asks for it
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # the API (REST and the /api/v1/ws WebSocket) and its documentation: the "server" container
    location /api/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;  # keep the live updates connection open
    }
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
    }

    # the application: any other path is handled by the client router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
