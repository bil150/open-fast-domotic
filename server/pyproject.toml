# Tool configuration only. Dependencies are in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # modern syntax
    "SIM",      # simplifications
    "ASYNC",    # async pitfalls
    "C4",       # comprehensions
    "PT",       # pytest style
    "RUF",      # ruff specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# no type information shipped by these
module = ["zigpy.*", "zigpy_znp.*", "croniter.*"]
ignore_missing_imports = true
